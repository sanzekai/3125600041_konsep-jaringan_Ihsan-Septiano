<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="url(#bg)" />
  <rect width="800" height="200" rx="12" fill="url(#grid)" />

  <!-- Network Connection Lines -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.35">
    <line x1="120" y1="60" x2="280" y2="100" />
    <line x1="120" y1="140" x2="280" y2="100" />
    <line x1="280" y1="100" x2="520" y2="100" />
    <line x1="520" y1="100" x2="680" y2="60" />
    <line x1="520" y1="100" x2="680" y2="140" />
    <line x1="280" y1="100" x2="400" y2="45" stroke-dasharray="4 4" />
    <line x1="400" y1="45" x2="520" y2="100" stroke-dasharray="4 4" />
  </g>

  <!-- Animated Data Packets -->
  <!-- Packet 1: Client 1 -> Router 1 -> Router 2 -> Server 1 -->
  <circle r="4" fill="#38bdf8" filter="url(#glow)">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M 120,60 L 280,100 L 520,100 L 680,60" />
  </circle>

  <!-- Packet 2: Server 2 -> Router 2 -> Router 1 -> Client 2 -->
  <circle r="4" fill="#4ade80" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 680,140 L 520,100 L 280,100 L 120,140" />
  </circle>

  <!-- Packet 3: Ping Loop via Secondary Node -->
  <circle r="3" fill="#f472b6" filter="url(#glow)">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 280,100 L 400,45 L 520,100 L 280,100" />
  </circle>

  <!-- Nodes (Hosts & Routers) -->
  <!-- Left Hosts -->
  <circle cx="120" cy="60" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="120" cy="140" r="8" fill="#0f172a" stroke="#4ade80" stroke-width="2.5" />

  <!-- Core Routers -->
  <rect x="268" y="88" width="24" height="24" rx="6" fill="#0284c7" stroke="#e0f2fe" stroke-width="2" />
  <rect x="508" y="88" width="24" height="24" rx="6" fill="#0284c7" stroke="#e0f2fe" stroke-width="2" />
  <circle cx="400" cy="45" r="6" fill="#1e293b" stroke="#f472b6" stroke-width="2" />

  <!-- Right Servers -->
  <circle cx="680" cy="60" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="680" cy="140" r="8" fill="#0f172a" stroke="#4ade80" stroke-width="2.5" />

  <!-- Labels -->
  <text x="120" y="42" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Host A</text>
  <text x="120" y="165" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Host B</text>
  <text x="280" y="130" fill="#e2e8f0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Router 1</text>
  <text x="520" y="130" fill="#e2e8f0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Router 2</text>
  <text x="680" y="42" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Server 1</text>
  <text x="680" y="165" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Server 2</text>

  <!-- Title Overlay -->
  <text x="400" y="182" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle" letter-spacing="2">
    PACKET TRANSMISSION SIMULATION // COMPUTER NETWORKS
  </text>
</svg>